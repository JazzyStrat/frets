<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>frets</title>
        <link rel="stylesheet" href="assets/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <header>
            <h1>Triad Land</h1>
            <h3 id="instructions">Pick a Root Note on the fretboard</h3>
            <div id="triad-info"></div>
        </header>

        <div id="board"></div>
        <div id="dash">
            <div class="centerdash">
                <div id="color-key">
                    <div class="emb">Root</div>
                    <div class="emb third-color">3rd</div>
                    <div class="emb fifth-color">5th</div>
                </div>
                <h3 class="arrow-keys">keyboard arrows (←↓↑→ or hjkl)</h3>
                <div id="dpad">
                    <button id="up">↑</button>
                    <div id="padmiddle">
                        <button id="down-lat">←</button>
                        <button id="up-lat">→</button>
                    </div>
                    <button id="down">↓</button>
                </div>
            </div>
            <div id="buttons">
                <button id="min">min</button>
                <button id="maj">maj</button>
                <button id="dim">dim</button>
                <button id="aug">aug</button>
                <button id="sign-tog">♭</button>
            </div>
        </div>

        <h3>Free Range Board</h3>
        <div id="board2"></div>
        <script type="module" src="assets/main.js"></script>
        <script type="module" src="assets/maps.js"></script>
    </body>
</html>
