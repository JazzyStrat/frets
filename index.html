<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>frets</title>
        <link rel="stylesheet" href="assets/style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap"
            rel="stylesheet"
        />

        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Crect%20width%3D'100'%20height%3D'100'%20fill%3D'none'%2F%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%8E%B8%3C%2Ftext%3E%3C%2Fsvg%3E"
        />
    </head>

    <body>
        <header>
            <h1 id='title'>Brettboard</h1>
			<div id="triad-info"><p>Pick a Root Note on the fretboard</p></div>
        </header>

        <div id="board"></div>
        <div id="dash">
            <div class="centerdash">
                <div id="color-key">
                    <div class="emb">Root</div>
                    <div class="emb third-color">3rd</div>
                    <div class="emb fifth-color">5th</div>
                </div>
                <h4 class="arrow-keys">keyboard arrows (←↓↑→ or hjkl)</h3>
                <div id="dpad">
                    <button id="up">↑</button>
                    <div id="padmiddle">
                        <button id="down-lat">←</button>
                        <button id="up-lat">→</button>
                    </div>
                    <button id="down">↓</button>
                </div>
            </div>
            <div id="buttons">
				<div id="row-one">
                <button id="min">min</button>
                <button id="maj">maj</button>
                <button id="key-mode">key</button>
                <button id="dim">dim</button>
                <button id="aug">aug</button>
                <button id="sign-tog">♯</button>
				</div>
				<div id="row-two">
					<div id="cycle-btns">
                	<button id="cycle-down">cycle down</button>
                	<button id="cycle-up">cycle up</button>
					</div>
					<div id="cycle-speeds">
					<button id="speed-down">slower</button>
					<button id="speed-display">  </button>
					<button id="speed-up">faster</button>
					</div>
				</div>
            </div>
        </div>

        <h3>Free Range Board</h3>
        <div id="board2"></div>

        <script type="module" src="assets/main.js"></script>
        <script type="module" src="assets/maps.js"></script>
        <script type="module" src="assets/shifters.js"></script>
    </body>
</html>
