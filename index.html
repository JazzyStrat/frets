<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>frets</title>
        <link rel="stylesheet" href="assets/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <header>
            <h1>Triad Land</h1>
            <h3 id="instructions">Pick a Root Note on the fretboard</h3>
            <div id="triad-info"></div>
        </header>

        <div id="board"></div>
        <div id="dash">
            <div class="centerdash">
                <h3 class="arrows">keyboard arrows (↑↓←→ or hjkl)</h3>
                <div id="dpad">
                    <button id="up">↑</button>
                    <div id="padmiddle">
                        <button id="down-lat">←</button>
                        <button id="up-lat">→</button>
                    </div>
                    <button id="down">↓</button>
                </div>
            </div>
            <button id="min">Minor</button>
            <button id="maj">Major</button>
            <button id="sign-tog">flats (b)</button>
        </div>
        <h3>Free Range Board</h3>
        <div id="board2"></div>
        <script src="assets/main.js"></script>
    </body>
</html>
